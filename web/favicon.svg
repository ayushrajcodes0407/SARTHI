<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sarthi-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#16D9E8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#168A9A" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Executive Background Circle -->
  <circle cx="32" cy="32" r="30" fill="#0B1220" stroke="#16D9E8" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Outer Segmented Arc Reactor Ring -->
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="#16D9E8" stroke-width="1.8" stroke-dasharray="14 4.5" stroke-opacity="0.85"/>

  <!-- Inner Circuit Ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.45"/>

  <!-- Core Glow -->
  <circle cx="32" cy="32" r="15" fill="url(#core-glow)"/>

  <!-- Stylized Cyber S Core for SARTHI -->
  <path d="M 42 20 C 42 16 38 14 32 14 C 24 14 20 18 20 23 C 20 29 27 30 33 32 C 39 34 44 36 44 42 C 44 48 38 51 32 51 C 24 51 19 47 19 41 L 26 41 C 26 45 28 46.5 32 46.5 C 36 46.5 38 44.5 38 41.5 C 38 37 31 35.5 25 33.5 C 20 31.5 15 28.5 15 23 C 15 16 22 10 32 10 C 42 10 47 15 47 20 Z" fill="url(#sarthi-grad)" filter="url(#glow)"/>

  <!-- Central Arc Core Accent -->
  <circle cx="32" cy="32" r="3" fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="1.5" fill="#00F0FF"/>
</svg>
